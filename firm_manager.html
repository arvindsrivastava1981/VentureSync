<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VentureSync | Firm Manager & Roles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b132b] text-slate-100 font-sans min-h-screen p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 bg-slate-800 rounded-xl text-slate-300 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
        <h1 class="font-bold text-white text-base">Firm Manager: Staff User Provisioning</h1>
      </div>
      <a href="sales_executive.html" class="text-xs bg-emerald-600 px-4 py-2 rounded-xl text-white font-semibold">Open Sales Map &rarr;</a>
    </div>

    <div class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-6">
      <form onsubmit="addUser(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
        <input type="text" id="staff-name" placeholder="Staff Full Name" required class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
        <select id="staff-firm" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
          <option value="Shree Narayan Developer">Shree Narayan Developer</option>
          <option value="Freedom India Infraventure">Freedom India Infraventure</option>
        </select>
        <select id="staff-role" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
          <option value="Sales Executive">Sales Executive</option>
          <option value="Accounts Manager">Accounts Manager</option>
          <option value="External Broker">External Broker</option>
        </select>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded-xl p-3">Create User Account</button>
      </form>

      <div class="overflow-x-auto pt-4">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900 text-slate-400 uppercase">
            <tr>
              <th class="p-3">Staff Name</th>
              <th class="p-3">Firm Entity</th>
              <th class="p-3">Assigned Role</th>
              <th class="p-3 text-right">Access Status</th>
            </tr>
          </thead>
          <tbody id="users-tbody" class="divide-y divide-slate-800">
            <tr>
              <td class="p-3 font-bold text-white">Ramesh Gupta</td>
              <td class="p-3">Shree Narayan Developer</td>
              <td class="p-3">Sales Executive</td>
              <td class="p-3 text-right text-emerald-400">Active (Restricted to Site)</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    function addUser(e) {
      e.preventDefault();
      const name = document.getElementById('staff-name').value;
      const firm = document.getElementById('staff-firm').value;
      const role = document.getElementById('staff-role').value;
      document.getElementById('users-tbody').innerHTML += `
        <tr>
          <td class="p-3 font-bold text-white">${name}</td>
          <td class="p-3">${firm}</td>
          <td class="p-3">${role}</td>
          <td class="p-3 text-right text-emerald-400">Active (Restricted)</td>
        </tr>`;
      alert(`User ${name} created successfully!`);
    }
    lucide.createIcons();
  </script>
</body>
</html>
