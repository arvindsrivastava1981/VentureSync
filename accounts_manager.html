<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VentureSync | Accounts & Ledger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b132b] text-slate-100 font-sans min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 bg-slate-800 rounded-xl text-slate-300 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
        <h1 class="font-bold text-white text-base">Accounts Manager: Payment Ledger</h1>
      </div>
      <button onclick="alert('Opening payment collection modal...')" class="text-xs bg-emerald-600 px-4 py-2 rounded-xl text-white font-semibold">Log New Payment</button>
    </div>

    <div class="bg-slate-800/60 rounded-2xl border border-slate-700 shadow-xl overflow-hidden p-6">
      <table class="w-full text-left text-xs text-slate-300">
        <thead class="bg-slate-900 text-slate-400 uppercase">
          <tr>
            <th class="p-3">Receipt Ref</th>
            <th class="p-3">Plot #</th>
            <th class="p-3">Client Name</th>
            <th class="p-3">Mode</th>
            <th class="p-3">Amount</th>
            <th class="p-3 text-right">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800">
          <tr>
            <td class="p-3 font-mono text-slate-400">REC-9921</td>
            <td class="p-3 font-bold text-white">#102</td>
            <td class="p-3">Rajesh Kumar Sharma</td>
            <td class="p-3">Bank Wire (SBI Orai)</td>
            <td class="p-3 text-emerald-400 font-bold">₹18,75,000</td>
            <td class="p-3 text-right"><button onclick="window.print()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-lg">Print Receipt</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
