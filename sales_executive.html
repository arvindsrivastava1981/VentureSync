<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VentureSync | Sales Map & Layout Inspection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b132b] text-slate-100 font-sans min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 bg-slate-800 rounded-xl text-slate-300 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
        <div>
          <h1 class="font-bold text-white text-base">Sales Executive: Site Plan Layout Map</h1>
          <p class="text-[10px] text-slate-400">Shree Narayan Vihar, Orai Jalaun Highway</p>
        </div>
      </div>
      <a href="accounts_manager.html" class="text-xs bg-emerald-600 px-4 py-2 rounded-xl text-white font-semibold">Open Accounts Ledger &rarr;</a>
    </div>

    <!-- Interactive Grid -->
    <div class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-400 font-medium">Click any plot to hold or view details:</span>
        <div class="flex gap-3">
          <span class="flex items-center gap-1"><span class="w-3 h-3 bg-emerald-500 rounded-sm"></span> Available</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 bg-amber-500 rounded-sm"></span> Booked</span>
        </div>
      </div>
      <div id="plot-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-10 gap-3.5"></div>
    </div>
  </div>
  <script>
    const plots = Array.from({ length: 20 }, (_, i) => ({ id: 101 + i, area: 1200, status: i === 1 ? 'sold' : i === 7 ? 'booked' : 'available' }));
    
    function renderGrid() {
      const grid = document.getElementById('plot-grid');
      grid.innerHTML = '';
      plots.forEach(p => {
        const bg = p.status === 'available' ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-amber-950/40 border-amber-500/40 text-amber-300';
        grid.innerHTML += `
          <button onclick="alert('Inspecting Plot #${p.id} (${p.area} sqft) - Status: ${p.status.toUpperCase()}')" class="p-3.5 rounded-xl border text-center transition ${bg}">
            <span class="block text-sm font-bold text-white">#${p.id}</span>
            <span class="block text-[10px] opacity-80">${p.area} sqft</span>
          </button>`;
      });
    }
    renderGrid();
    lucide.createIcons();
  </script>
</body>
</html>
