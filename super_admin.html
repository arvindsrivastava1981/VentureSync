<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VentureSync | Super Admin & Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b132b] text-slate-100 font-sans min-h-screen p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 bg-slate-800 rounded-xl text-slate-300 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
        <h1 class="font-bold text-white text-base">Super Admin: Firm & Layout Onboarding</h1>
      </div>
      <span class="text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full border border-emerald-500/30">Master Governance</span>
    </div>

    <!-- Onboarding Form -->
    <div class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-6">
      <form onsubmit="handleOnboard(event)" class="grid grid-cols-1 md:grid-cols-2 gap-5 text-xs">
        <div>
          <label class="text-slate-400 block mb-1">Firm / Company Name *</label>
          <input type="text" id="firm-name" placeholder="e.g. Shree Narayan Developer" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Site / Venture Name *</label>
          <input type="text" id="site-name" placeholder="e.g. Shree Narayan Vihar" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Site Location & Highway *</label>
          <input type="text" id="site-loc" placeholder="e.g. Orai Jalaun State Highway, UP" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">UP-RERA Registration ID *</label>
          <input type="text" id="site-rera" placeholder="e.g. UP-RERA-JAL-2024-98421" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white">
        </div>
        <div class="md:col-span-2 space-y-2">
          <label class="text-slate-400 block">Development USPs</label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <label class="flex items-center gap-2 bg-slate-900 p-3 rounded-xl border border-slate-700"><input type="checkbox" name="usp" value="30 Feet Road" checked> 30 Feet Road</label>
            <label class="flex items-center gap-2 bg-slate-900 p-3 rounded-xl border border-slate-700"><input type="checkbox" name="usp" value="Central Park" checked> Central Park</label>
            <label class="flex items-center gap-2 bg-slate-900 p-3 rounded-xl border border-slate-700"><input type="checkbox" name="usp" value="Temple Complex" checked> Temple Complex</label>
            <label class="flex items-center gap-2 bg-slate-900 p-3 rounded-xl border border-slate-700"><input type="checkbox" name="usp" value="Underground Sewer" checked> Underground Sewer</label>
          </div>
        </div>
        <div class="md:col-span-2">
          <label class="text-slate-400 block mb-1">Upload Site Layout PDF / CAD Plan</label>
          <input type="file" accept=".pdf,image/*" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white">
        </div>
        <div class="md:col-span-2 flex justify-end pt-4">
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl shadow">Onboard Firm & Publish Site Layout</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    function handleOnboard(e) {
      e.preventDefault();
      alert('Firm and site layout successfully onboarded into VentureSync database!');
      window.location.href = 'firm_manager.html';
    }
    lucide.createIcons();
  </script>
</body>
</html>
